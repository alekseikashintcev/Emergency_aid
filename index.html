function getDiagnosis(code, patientType) {
  const map = {
    CARDIAC: patientType === "child" ? "cardiac_arrest_pediatric"
            : patientType === "pregnant" ? "cardiac_arrest_pregnancy"
            : "cardiac_arrest",
    FBAO: patientType === "child" ? "fbao_child" : "fbao_adult",
    BLEEDING: "bleeding",
    SYNCOPE: "syncope",
    TACHY: "tachycardia",
    BRADY: "bradycardia",
  };
  return map[code] || "syncope";
}

/* ═══════════════════════════════════════════════
   КОМПОНЕНТ ТАЙМЕР
═══════════════════════════════════════════════ */
function Timer({ seconds, label }) {
  const [left, setLeft] = useState(seconds);
  const [run, setRun] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (run && left > 0) { ref.current = setInterval(() => setLeft(l => l - 1), 1000); }
    else { clearInterval(ref.current); if (left === 0) setRun(false); }
    return () => clearInterval(ref.current);
  }, [run, left]);

  const toggle = () => { if (left === 0) setLeft(seconds); setRun(r => !r); };
  const m = Math.floor(left / 60), s = left % 60;
  const done = left === 0;

  return (
    <div className="tmr">
      <div>
        <div className="tmrd" style={{ color: done ? C.red : run ? C.green : C.text }}>
          {`${m}:${s.toString().padStart(2,"0")}`}
        </div>
        <div className="tmrl">{done ? "✓ Время вышло!" : label || "Таймер"}</div>
      </div>
      <button className={`tmrb${run ? " run" : ""}`} onClick={toggle}>
        {done ? "↺" : run ? "⏸ Стоп" : "▶ Старт"}
      </button>
    </div>
  );
}

}
